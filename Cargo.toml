[package]
name = "quadcast-s"
version = "0.1.0"
edition = "2021"
description = "Control del HyperX QuadCast S en Linux (RGB y eventos de silencio)"
license = "GPL-2.0-or-later"

[dependencies]
rusb = "0.9"
ctrlc = "3"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# libusb se compila dentro del binario: en Windows no hay una instalada.
rusb = { version = "0.9", features = ["vendored"] }
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

# Paquetes: `cargo deb` y `cargo generate-rpm`. Antes hay que generar la web
# (`npm --prefix web run build`) y compilar en release.
[package.metadata.deb]
maintainer = "Daniel Lazaro <noreply@users.noreply.github.com>"
section = "sound"
priority = "optional"
depends = "libc6, libusb-1.0-0"
extended-description = "Controla el RGB, el sensor de silencio y el mezclador de audio del HyperX QuadCast S desde una interfaz web local."
assets = [
    ["target/release/quadcast-s", "usr/bin/", "755"],
    ["contrib/quadcast-s.pkg.service", "usr/lib/systemd/user/quadcast-s.service", "644"],
    ["contrib/70-quadcast-s.rules", "usr/lib/udev/rules.d/70-quadcast-s.rules", "644"],
    ["README.md", "usr/share/doc/quadcast-s/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/quadcast-s", dest = "/usr/bin/quadcast-s", mode = "755" },
    { source = "contrib/quadcast-s.pkg.service", dest = "/usr/lib/systemd/user/quadcast-s.service", mode = "644" },
    { source = "contrib/70-quadcast-s.rules", dest = "/usr/lib/udev/rules.d/70-quadcast-s.rules", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/quadcast-s/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
libusb1 = "*"
