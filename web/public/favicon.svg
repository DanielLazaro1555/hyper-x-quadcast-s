<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HyperX QuadCast S">
  <title>QuadCast S</title>
  <defs>
    <!-- Degradado RGB de la cápsula: rojo, violeta y azul, como el LED del micrófono. -->
    <linearGradient id="rgb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- Rejilla: agujeros por los que se ve la luz. -->
    <pattern id="mesh" width="5" height="4.4" patternUnits="userSpaceOnUse">
      <rect width="5" height="4.4" fill="#0b1020"/>
      <circle cx="2.5" cy="2.2" r="1.45" fill="url(#rgb)"/>
    </pattern>
    <clipPath id="capsule"><rect x="21" y="7" width="22" height="34" rx="11"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#111827"/>
  <!-- Luz de la cápsula y rejilla encima. -->
  <rect x="21" y="7" width="22" height="34" rx="11" fill="url(#rgb)"/>
  <g clip-path="url(#capsule)">
    <rect x="21" y="7" width="22" height="34" fill="url(#mesh)" opacity="0.62"/>
  </g>
  <rect x="21" y="7" width="22" height="34" rx="11" fill="none" stroke="#e5e7eb" stroke-width="1.6"/>
  <!-- Suspensión elástica. -->
  <path d="M15 31c0 11 7 17 17 17s17-6 17-17" fill="none" stroke="#e5e7eb" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Soporte y base. -->
  <path d="M32 48v6" stroke="#e5e7eb" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="21" y="53.5" width="22" height="3.6" rx="1.8" fill="#e5e7eb"/>
</svg>
